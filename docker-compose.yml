services:
  veritabani:
    image: postgres:16
    container_name: moodflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: moodflow
      POSTGRES_USER: moodflow_user
      POSTGRES_PASSWORD: moodflow_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: moodflow_api
    depends_on:
      - veritabani
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://moodflow_user:moodflow_pass@veritabani:5432/moodflow
      PORT: 5000
    ports:
      - "5000:5000"

volumes:
  postgres_data:
